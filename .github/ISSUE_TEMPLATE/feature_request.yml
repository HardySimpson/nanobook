name: 提一个建议
description: 想要的功能、觉得别扭的地方
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目刻意做得小：本地优先、不托管正文、不做付费墙。
        如果建议和这几条冲突（比如「云端存我的书」），大概率不会做，先说清楚免得白等。
  - type: textarea
    id: what
    attributes:
      label: 想要什么
      placeholder: 一句话说清就行
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 现在哪里别扭
      placeholder: 你现在是怎么做的、卡在哪一步
  - type: dropdown
    id: scope
    attributes:
      label: 大致属于哪一块
      options:
        - 阅读器（排版、翻页、批注）
        - 书架与书单
        - 发现页
        - 听书（TTS）
        - 导入与格式（EPUB / PDF / TXT）
        - 账号与同步
        - 其他
